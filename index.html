    {q:{ja:'申告するものはありますか？',en:'Do you have anything to declare?',fr:'Avez-vous quelque chose à déclarer ?',es:'¿Tiene algo que declarar?',ru:'Есть ли у вас что-нибудь для декларирования?',ko:'신고할 물건이 있나요?',zh:'有需要申报的物品吗？',zhTW:'有需要申報的物品嗎？',th:'มีของต้องสำแดงไหม?',uz:'Deklaratsiya qiladigan narsangiz bormi?'},a:{ja:'いいえ、ありません。／はい、[品目]を申告します。',en:'No, I have nothing to declare. / Yes, I have [item] to declare.',fr:'Non, je n’ai rien à déclarer. / Oui, je dois déclarer [article].',es:'No tengo nada que declarar. / Sí, tengo que declarar [artículo].',ru:'Нет, мне нечего декларировать. / Да, вот [предмет], который нужно задекларировать.',ko:'아니요, 없습니다. / 네, [물품]을 신고하겠습니다.',zh:'没有。/ 有，我要申报[物品]。',zhTW:'沒有。/ 有，我要申報[物品]。',th:'ไม่มีค่ะ/ครับ / มีค่ะ/ครับ [สิ่งของ] ต้องสำแดง',uz:'Yo‘q, hech narsa yo‘q. / Ha, [buyum]ni deklaratsiya qilmoqchiman.'}}
  ];
  const labels={en:{basic:'Basics',transport:'Transport',hotel:'Hotel',food:'Food',emergency:'Emergencies'},ko:{basic:'기본',transport:'교통',hotel:'호텔',food:'식사',emergency:'긴급 상황'},zh:{basic:'基本',transport:'交通',hotel:'酒店',food:'用餐',emergency:'紧急情况'},th:{basic:'พื้นฐาน',transport:'การเดินทาง',hotel:'โรงแรม',food:'อาหาร',emergency:'ฉุกเฉิน'},ja:{basic:'基本',transport:'交通',hotel:'ホテル',food:'食事',emergency:'困ったとき'}};
  const langEl=document.querySelector('#language'),searchEl=document.querySelector('#search'),grid=document.querySelector('#phrases'),faqEl=document.querySelector('#customsFaq'),nav=document.querySelector('#categories'),count=document.querySelector('#count'),favBtn=document.querySelector('#favoritesOnly');let category='all',favorites=new Set(JSON.parse(localStorage.getItem('tabi-favorites')||'[]')),onlyFavorites=false;
  function renderTabs(){nav.innerHTML=categories.map(([id,jp])=>`<button class="tab ${category===id?'active':''}" data-category="${id}">${jp}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{category=b.dataset.category;render()})}
  function faqLanguageRows(values,lang){const rows=[['日本語',values.ja],['English',values.en]];if(lang!=='ja'&&lang!=='en')rows.push([languageNames[lang]||lang,values[lang]]);return rows.map(([label,value])=>`<div class="faq-line"><span class="faq-line-label">${label}</span><span>${value}</span></div>`).join('')}
  function render(){
    renderTabs();
    const q=searchEl.value.trim().toLocaleLowerCase(),lang=langEl.value;
    const shown=phrases.filter(p=>(category==='all'||p.category===category)&&(!onlyFavorites||favorites.has(p.id))&&(!q||[p.ja,p.en,translationFor(p,lang),p.pron?.[lang]].some(v=>v?.toLocaleLowerCase().includes(q))));
    const visibleFaqs=category==='customs'&&!onlyFavorites?customsFaqs.filter(f=>!q||[f.q.ja,f.q.en,f.q[lang],f.a.ja,f.a.en,f.a[lang]].some(v=>v?.toLocaleLowerCase().includes(q))):[];
    count.textContent=`${shown.length} フレーズ${visibleFaqs.length?`・税関Q&A ${visibleFaqs.length}件`:''}`;
    faqEl.innerHTML=visibleFaqs.length?`<h2 class="faq-title">税関でよく聞かれる質問と回答例</h2><p class="faq-note">回答例です。[X]や[ホテル名]、[品目]は実際の内容に置き換えてください。</p><div class="faq-grid">${visibleFaqs.map(f=>`<article class="faq-card"><div class="faq-part"><p class="faq-heading">質問</p>${faqLanguageRows(f.q,lang)}</div><div class="faq-part"><p class="faq-heading">回答例</p>${faqLanguageRows(f.a,lang)}</div></article>`).join('')}</div>`:'';
    grid.innerHTML=shown.length?shown.map(p=>{
      const translation=translationFor(p,lang),pron=p.pron?.[lang],categoryJa=categories.find(([id])=>id===p.category)?.[1],showExtra=lang!=='ja'&&lang!=='en';
      return `<article class="card"><div class="card-head"><span class="category">${categoryJa}</span><div class="actions"><button class="icon-btn ${favorites.has(p.id)?'favorite':''}" data-fav="${p.id}" aria-label="お気に入り" title="お気に入り">${favorites.has(p.id)?'★':'☆'}</button></div></div><div class="phrase-stack"><div class="phrase-row ${lang==='ja'?'primary':''}"><span class="phrase-label">日本語</span><p class="phrase-text ${lang==='ja'?'primary-text':''}" lang="ja">${p.ja}</p></div><div class="phrase-row ${lang==='en'?'primary':''}"><span class="phrase-label">English</span><p class="phrase-text ${lang==='en'?'primary-text':''}" lang="en">${p.en}</p></div>${showExtra?`<div class="phrase-row primary"><span class="phrase-label">${languageNames[lang]||lang}</span><p class="phrase-text primary-text" lang="${lang}">${translation}</p></div>`:''}</div>${pron?`<p class="pronunciation">読み方：${pron}</p>`:''}<div class="card-foot"><button class="speak-btn" data-speak="${p.id}">🔊　聞く</button><button class="copy-btn" data-copy="${p.id}">コピー</button></div></article>`
    }).join(''):visibleFaqs.length?'':'<div class="empty">フレーズが見つかりませんでした。<br>検索語やカテゴリーを変えてみてください。</div>';
    grid.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const id=b.dataset.fav;favorites.has(id)?favorites.delete(id):favorites.add(id);localStorage.setItem('tabi-favorites',JSON.stringify([...favorites]));render()});
    grid.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>{const p=phrases.find(x=>x.id===b.dataset.speak),u=new SpeechSynthesisUtterance(translationFor(p,lang));u.lang={en:'en-US',fr:'fr-FR',es:'es-ES',ru:'ru-RU',ko:'ko-KR',zh:'zh-CN',zhTW:'zh-TW',th:'th-TH',uz:'uz-UZ',ja:'ja-JP'}[lang];speechSynthesis.cancel();speechSynthesis.speak(u)});
    grid.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const p=phrases.find(x=>x.id===b.dataset.copy);try{await navigator.clipboard.writeText(translationFor(p,lang));toast('コピーしました')}catch{toast('コピーできませんでした')}})
  }
  let toastTimer;function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
  langEl.onchange=render;searchEl.oninput=render;favBtn.onclick=()=>{onlyFavorites=!onlyFavorites;favBtn.classList.toggle('active',onlyFavorites);favBtn.setAttribute('aria-pressed',String(onlyFavorites));favBtn.textContent=onlyFavorites?'★ お気に入り':'☆ お気に入り';render()};render();
  </script>
</body>
</html>
