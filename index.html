  const translationFor=(phrase,language)=>extraTranslations[phrase.id]?.[language]??phrase[language];
  const labels={en:{basic:'Basics',transport:'Transport',hotel:'Hotel',food:'Food',emergency:'Emergencies'},ko:{basic:'기본',transport:'교통',hotel:'호텔',food:'식사',emergency:'긴급 상황'},zh:{basic:'基本',transport:'交通',hotel:'酒店',food:'用餐',emergency:'紧急情况'},th:{basic:'พื้นฐาน',transport:'การเดินทาง',hotel:'โรงแรม',food:'อาหาร',emergency:'ฉุกเฉิน'},ja:{basic:'基本',transport:'交通',hotel:'ホテル',food:'食事',emergency:'困ったとき'}};
  const langEl=document.querySelector('#language'),searchEl=document.querySelector('#search'),grid=document.querySelector('#phrases'),nav=document.querySelector('#categories'),count=document.querySelector('#count'),favBtn=document.querySelector('#favoritesOnly');let category='all',favorites=new Set(JSON.parse(localStorage.getItem('tabi-favorites')||'[]')),onlyFavorites=false;
  function renderTabs(){nav.innerHTML=categories.map(([id,jp])=>`<button class="tab ${category===id?'active':''}" data-category="${id}">${jp}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{category=b.dataset.category;render()})}
  function render(){
    renderTabs();
    const q=searchEl.value.trim().toLocaleLowerCase(),lang=langEl.value;
    const shown=phrases.filter(p=>(category==='all'||p.category===category)&&(!onlyFavorites||favorites.has(p.id))&&(!q||[p.ja,translationFor(p,lang),p.pron?.[lang]].some(v=>v?.toLocaleLowerCase().includes(q))));
    count.textContent=`${shown.length} フレーズ`;
    grid.innerHTML=shown.length?shown.map(p=>{
      const translation=translationFor(p,lang),pron=p.pron?.[lang],categoryJa=categories.find(([id])=>id===p.category)?.[1];
      return `<article class="card"><div class="card-head"><span class="category">${categoryJa}</span><div class="actions"><button class="icon-btn ${favorites.has(p.id)?'favorite':''}" data-fav="${p.id}" aria-label="お気に入り" title="お気に入り">${favorites.has(p.id)?'★':'☆'}</button></div></div><p class="japanese">日本語　${p.ja}</p><p class="translation" lang="${lang}">${translation}</p>${pron?`<p class="pronunciation">読み方：${pron}</p>`:''}<div class="card-foot"><button class="speak-btn" data-speak="${p.id}">🔊　聞く</button><button class="copy-btn" data-copy="${p.id}">コピー</button></div></article>`
    }).join(''):'<div class="empty">フレーズが見つかりませんでした。<br>検索語やカテゴリーを変えてみてください。</div>';
    grid.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const id=b.dataset.fav;favorites.has(id)?favorites.delete(id):favorites.add(id);localStorage.setItem('tabi-favorites',JSON.stringify([...favorites]));render()});
    grid.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>{const p=phrases.find(x=>x.id===b.dataset.speak),u=new SpeechSynthesisUtterance(translationFor(p,lang));u.lang={en:'en-US',fr:'fr-FR',es:'es-ES',ko:'ko-KR',zh:'zh-CN',zhTW:'zh-TW',th:'th-TH',uz:'uz-UZ',ja:'ja-JP'}[lang];speechSynthesis.cancel();speechSynthesis.speak(u)});
    grid.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const p=phrases.find(x=>x.id===b.dataset.copy);try{await navigator.clipboard.writeText(translationFor(p,lang));toast('コピーしました')}catch{toast('コピーできませんでした')}})
  }
  let toastTimer;function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
  langEl.onchange=render;searchEl.oninput=render;favBtn.onclick=()=>{onlyFavorites=!onlyFavorites;favBtn.classList.toggle('active',onlyFavorites);favBtn.setAttribute('aria-pressed',String(onlyFavorites));favBtn.textContent=onlyFavorites?'★ お気に入り':'☆ お気に入り';render()};render();
  </script>
</body>
</html>
